name: centraldeatendimentochat-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  rails:
    image: ${CHATWOOT_IMAGE:?Defina CHATWOOT_IMAGE com uma tag imutável}
    init: true
    restart: unless-stopped
    env_file:
      - ${CHATWOOT_ENV_FILE:?Defina CHATWOOT_ENV_FILE fora do clone}
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      PORT: 3000
    volumes:
      - ${CHATWOOT_STORAGE_DIR:?Defina CHATWOOT_STORAGE_DIR}:/app/storage
    ports:
      - '127.0.0.1:${CHATWOOT_APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ruby -rnet/http -e 'response = Net::HTTP.get_response(URI("http://127.0.0.1:3000/health"));
          exit(response.is_a?(Net::HTTPSuccess) ? 0 : 1)'
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - 'hub.2.chatwoot.com:127.0.0.1'
    networks:
      - private

  sidekiq:
    image: ${CHATWOOT_IMAGE:?Defina CHATWOOT_IMAGE com uma tag imutável}
    init: true
    restart: unless-stopped
    env_file:
      - ${CHATWOOT_ENV_FILE:?Defina CHATWOOT_ENV_FILE fora do clone}
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    volumes:
      - ${CHATWOOT_STORAGE_DIR:?Defina CHATWOOT_STORAGE_DIR}:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - 'hub.2.chatwoot.com:127.0.0.1'
    networks:
      - private

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - ${CHATWOOT_POSTGRES_DATA_DIR:?Defina CHATWOOT_POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    volumes:
      - ${CHATWOOT_REDIS_DATA_DIR:?Defina CHATWOOT_REDIS_DATA_DIR}:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    networks:
      - private

networks:
  private:
    name: centraldeatendimentochat_private
