name: centraldeatendimentochat-local

services:
  base: &base
    build:
      context: ../..
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: 'false'
    tty: true
    stdin_open: true
    image: centraldeatendimentochat:development
    env_file:
      - ${CHATWOOT_ENV_FILE:?Defina CHATWOOT_ENV_FILE para o env local}

  rails:
    <<: *base
    build:
      context: ../..
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
      args:
        BASE_IMAGE: centraldeatendimentochat:development
    image: centraldeatendimentochat-rails:development
    volumes:
      - ../..:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vite:
        condition: service_started
      mailhog:
        condition: service_started
      sidekiq:
        condition: service_started
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      VITE_DEV_SERVER_HOST: vite
      NODE_ENV: development
      RAILS_ENV: development
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    image: centraldeatendimentochat-rails:development
    volumes:
      - ../..:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: development
      RAILS_ENV: development
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  vite:
    <<: *base
    build:
      context: ../..
      dockerfile: ./docker/dockerfiles/vite.Dockerfile
      args:
        BASE_IMAGE: centraldeatendimentochat:development
    image: centraldeatendimentochat-vite:development
    volumes:
      - ../..:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/usr/local/bundle
    ports:
      - '127.0.0.1:3036:3036'
    environment:
      VITE_DEV_SERVER_HOST: 0.0.0.0
      NODE_ENV: development
      RAILS_ENV: development
    entrypoint: docker/entrypoints/vite.sh
    command: ['bin/vite', 'dev']

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ${CHATWOOT_POSTGRES_DATA_DIR:?Defina CHATWOOT_POSTGRES_DATA_DIR}:${PGDATA:-/var/lib/postgresql/data}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_dev}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ${CHATWOOT_REDIS_DATA_DIR:?Defina CHATWOOT_REDIS_DATA_DIR}:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  node_modules:
  packs:
  cache:
  bundle:
