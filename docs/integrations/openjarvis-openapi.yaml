      $ref: ./openjarvis-openapi/schemas.yaml#/ErrorResponse
    CursorMeta:
      $ref: ./openjarvis-openapi/schemas.yaml#/CursorMeta
    Contact:
      $ref: ./openjarvis-openapi/schemas.yaml#/Contact
    Conversation:
      $ref: ./openjarvis-openapi/schemas.yaml#/Conversation
    Message:
      $ref: ./openjarvis-openapi/schemas.yaml#/Message
    Inbox:
      $ref: ./openjarvis-openapi/schemas.yaml#/Inbox
    WebhookEnvelope:
      $ref: ./openjarvis-openapi/schemas.yaml#/WebhookEnvelope
  parameters:
    Id:
      $ref: ./openjarvis-openapi/parameters.yaml#/Id
    InboxId:
      $ref: ./openjarvis-openapi/parameters.yaml#/InboxId
    ConversationId:
      $ref: ./openjarvis-openapi/parameters.yaml#/ConversationId
    Cursor:
      $ref: ./openjarvis-openapi/parameters.yaml#/Cursor
    Limit:
      $ref: ./openjarvis-openapi/parameters.yaml#/Limit
    IdempotencyKey:
      $ref: ./openjarvis-openapi/parameters.yaml#/IdempotencyKey
  responses:
