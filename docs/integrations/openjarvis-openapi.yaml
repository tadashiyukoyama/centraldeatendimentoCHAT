    ValidationError:
      $ref: ./openjarvis-openapi/responses.yaml#/ValidationError
    Conflict:
      $ref: ./openjarvis-openapi/responses.yaml#/Conflict
    RateLimited:
      $ref: ./openjarvis-openapi/responses.yaml#/RateLimited
    Unavailable:
      $ref: ./openjarvis-openapi/responses.yaml#/Unavailable
    InternalError:
      $ref: ./openjarvis-openapi/responses.yaml#/InternalError
