MessageCreatedWebhook:
  post:
    operationId: webhook.message.created
    summary: Message created
    parameters: &signedHeaders
      - {
          name: X-AceleraChat-Delivery,
          in: header,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: X-AceleraChat-Timestamp,
          in: header,
          required: true,
          schema: { type: integer },
        }
      - {
          name: X-AceleraChat-Signature,
          in: header,
          required: true,
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' },
        }
      - {
          name: X-AceleraChat-Signature-Previous,
          in: header,
          required: false,
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' },
        }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: ./schemas.yaml#/WebhookEnvelope
              - type: object
                properties:
                  event: { const: message.created }
                  resource:
                    allOf:
                      - $ref: ./schemas.yaml#/ResourceIdentity
                      - type: object
                        properties: { type: { const: Message } }
                  data: { $ref: ./schemas.yaml#/Message }
          examples:
            event: { $ref: ./webhook-examples.yaml#/MessageCreated }
    responses: &receiverResponses
      '202': { description: Durably accepted }
      '400': { description: Permanent invalid payload }
      '401': { description: Permanent invalid signature }
      '409': { description: Temporary receiver conflict; AceleraChat retries }
      '429': { description: Temporary receiver rate limit; AceleraChat retries }
      '500': { description: Temporary receiver failure; AceleraChat retries }
MessageUpdatedWebhook:
  post:
    operationId: webhook.message.updated
    summary: Message updated, including delivery status changes
    parameters: *signedHeaders
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: ./schemas.yaml#/WebhookEnvelope
              - type: object
                properties:
                  event: { const: message.updated }
                  resource:
                    allOf:
                      - $ref: ./schemas.yaml#/ResourceIdentity
                      - type: object
                        properties: { type: { const: Message } }
                  data: { $ref: ./schemas.yaml#/Message }
          examples:
            event: { $ref: ./webhook-examples.yaml#/MessageUpdated }
    responses: *receiverResponses
