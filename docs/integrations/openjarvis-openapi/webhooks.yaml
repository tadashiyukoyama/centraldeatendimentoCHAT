ConversationStatusChangedWebhook:
  post:
    operationId: webhook.conversation.status_changed
    summary: Conversation status changed
    parameters: *signedHeaders
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: ./schemas.yaml#/WebhookEnvelope
              - type: object
                required: [changed_attributes]
                properties:
                  event: { const: conversation.status_changed }
                  resource:
                    allOf:
                      - $ref: ./schemas.yaml#/ResourceIdentity
                      - type: object
                        properties: { type: { const: Conversation } }
                  data: { $ref: ./schemas.yaml#/Conversation }
                  changed_attributes:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: array
                        prefixItems:
                          - { type: [string, 'null'] }
                          - { type: string }
                        minItems: 2
                        maxItems: 2
          examples:
            event: { $ref: ./webhook-examples.yaml#/ConversationStatusChanged }
    responses: *receiverResponses
