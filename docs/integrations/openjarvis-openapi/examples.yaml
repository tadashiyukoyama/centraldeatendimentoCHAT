Catalog:
  value:
    name: AceleraChat OpenJarvis API
    version: 2026-08-19.2
    schema_version: '1.0'
    implementation_base_sha: 128d00a1743e198eb370f55fbaf7bffe7a2b01f1
    implementation_release: sanitized-release-sha
    openapi: /api/v1/openjarvis/openapi
    authentication:
      {
        type: bearer,
        header: Authorization,
        rotation_grace_seconds: 86400,
        simultaneous_credentials: 2,
      }
    idempotency:
      {
        required_for: [POST, PATCH],
        header: Idempotency-Key,
        minimum_length: 8,
        replay_header: Idempotency-Replayed,
        retention_seconds: 2592000,
      }
    rate_limits:
      read: { limit: 120, window_seconds: 60, retry_after_header: true }
      write: { limit: 30, window_seconds: 60, retry_after_header: true }
    retention:
      {
        idempotency_seconds: 2592000,
        webhook_delivery_metadata_seconds: 2592000,
        webhook_payload_persisted: false,
      }
    scopes: [inboxes:read]
    webhook_subscriptions: [message.created]
    webhook_delivery:
      {
        semantic: at_least_once,
        duplicates_possible: true,
        global_ordering: false,
        per_resource_sequence: true,
        retry_attempts: 5,
        temporary_failures: [transport, 408, 409, 425, 429, 5xx],
        permanent_failures: [other_4xx],
        reconciliation_endpoint: /api/v1/openjarvis/backfill,
      }
    channel_capabilities: {}
    errors: {}
    operations:
      - id: inboxes.health
        method: GET
        path: /api/v1/openjarvis/inboxes/{inbox_id}/health
        scope: inboxes:read
        description: Read inbox connection and capabilities
        executable: true
        idempotency_required: false
        input_schema: { type: object, required: [inbox_id] }
        output_schema:
          {
            $ref: /api/v1/openjarvis/openjarvis-openapi/schemas.yaml#/InboxHealthResponse,
          }
    endpoints:
      - {
          method: GET,
          path: '/api/v1/openjarvis/inboxes/{inbox_id}/health',
          scope: inboxes:read,
          description: Read inbox connection and capabilities,
        }
