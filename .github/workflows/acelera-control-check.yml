name: Acelera Control targeted quality gate

on:
  push:
    branches:
      - release/strict-team-conversation-privacy
    paths:
      - '.github/workflows/acelera-control-check.yml'
      - '.env.example'
      - 'app/controllers/dashboard_controller.rb'
      - 'app/javascript/dashboard/api/changelog.js'
      - 'app/javascript/dashboard/api/specs/changelog.spec.js'
      - 'app/javascript/dashboard/components-next/sidebar/SidebarChangelogCard.vue'
      - 'app/javascript/shared/constants/links.js'
      - 'app/jobs/internal/check_new_versions_job.rb'
      - 'app/services/notification/push_notification_service.rb'
      - 'app/services/notification/push_test_service.rb'
      - 'app/views/super_admin/**'
      - 'config/installation_config.yml'
      - 'enterprise/app/jobs/enterprise/internal/check_new_versions_job.rb'
      - 'enterprise/app/services/internal/reconcile_plan_config_service.rb'
      - 'lib/acelera_control.rb'
      - 'lib/acelera_control/**'
      - 'lib/chatwoot_hub.rb'
      - 'spec/enterprise/jobs/enterprise/internal/check_new_versions_job_spec.rb'
      - 'spec/enterprise/lib/chatwoot_hub_spec.rb'
      - 'spec/enterprise/services/internal/reconcile_plan_config_service_spec.rb'
      - 'spec/jobs/internal/check_new_versions_job_spec.rb'
      - 'spec/lib/acelera_control_spec.rb'
      - 'spec/lib/chatwoot_hub_spec.rb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379
      ACELERA_CONTROL_ENABLED: 'false'
      ENABLE_PUSH_RELAY_SERVER: 'false'

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run targeted Ruby lint
        run: >-
          bundle exec rubocop
          app/controllers/dashboard_controller.rb
          app/jobs/internal/check_new_versions_job.rb
          app/services/notification/push_notification_service.rb
          app/services/notification/push_test_service.rb
          enterprise/app/jobs/enterprise/internal/check_new_versions_job.rb
          enterprise/app/services/internal/reconcile_plan_config_service.rb
          lib/acelera_control.rb
          lib/acelera_control/entitlement.rb
          lib/acelera_control/url_policy.rb
          lib/chatwoot_hub.rb
          spec/enterprise/jobs/enterprise/internal/check_new_versions_job_spec.rb
          spec/enterprise/lib/chatwoot_hub_spec.rb
          spec/enterprise/services/internal/reconcile_plan_config_service_spec.rb
          spec/jobs/internal/check_new_versions_job_spec.rb
          spec/lib/acelera_control_spec.rb
          spec/lib/chatwoot_hub_spec.rb

      - name: Prepare test database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      - name: Run targeted Rails specs
        run: >-
          bundle exec rspec
          spec/lib/acelera_control_spec.rb
          spec/lib/chatwoot_hub_spec.rb
          spec/jobs/internal/check_new_versions_job_spec.rb
          spec/enterprise/lib/chatwoot_hub_spec.rb
          spec/enterprise/jobs/enterprise/internal/check_new_versions_job_spec.rb
          spec/enterprise/services/internal/reconcile_plan_config_service_spec.rb
          spec/services/notification/push_notification_service_spec.rb
          spec/controllers/installation/onboarding_controller_spec.rb
          --format progress

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted frontend lint
        run: >-
          pnpm exec eslint
          app/javascript/dashboard/api/changelog.js
          app/javascript/dashboard/api/specs/changelog.spec.js
          app/javascript/dashboard/components-next/sidebar/SidebarChangelogCard.vue
          app/javascript/shared/constants/links.js

      - name: Run targeted frontend spec
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/api/specs/changelog.spec.js
          --no-cache
          --no-coverage
