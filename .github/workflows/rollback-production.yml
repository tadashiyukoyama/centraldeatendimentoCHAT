name: Roll back production image through ICP

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character commit SHA of a previous production image
        required: true
        type: string
      image_repository:
        description: GHCR namespace containing the rollback image
        required: true
        type: choice
        options:
          - ghcr.io/tadashiyukoyama/centraldeatendimentochat
          - ghcr.io/cesaryukoyama28-eng/centraldeatendimentochat
      confirmation:
        description: Type ROLLBACK to confirm the production rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: centraldeatendimentochat-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, Linux, X64, acelerachat-ci]
    environment: production
    steps:
      - name: Validate explicit rollback target
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          case "$IMAGE_REPOSITORY" in
            ghcr.io/tadashiyukoyama/centraldeatendimentochat|ghcr.io/cesaryukoyama28-eng/centraldeatendimentochat) ;;
            *) exit 64 ;;
          esac
          test "$CONFIRMATION" = 'ROLLBACK'

      - name: Checkout current production contract
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate rollback target ancestry
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git cat-file -e "$IMAGE_TAG^{commit}"
          git merge-base --is-ancestor "$IMAGE_TAG" origin/main

      - name: Prepare deploy key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY"
          printf '%s\n' "$PROD_SSH_KEY" > "$RUNNER_TEMP/prod-key"
          chmod 600 "$RUNNER_TEMP/prod-key"

      - name: Prepare pinned SSH host key
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_SSH_HOST_KEY: ${{ vars.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          test -n "$PROD_PORT"
          test -n "$PROD_SSH_HOST_KEY"
          [[ "$PROD_SSH_HOST_KEY" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]]
          scan_file="$RUNNER_TEMP/prod-host-key.ed25519.scan"
          known_hosts_file="$RUNNER_TEMP/prod-known-hosts"
          ssh-keyscan \
            -T 15 \
            -t ed25519 \
            -p "$PROD_PORT" \
            "$PROD_HOST" \
            > "$scan_file" \
            2>/dev/null
          test -s "$scan_file"
          awk 'NF < 3 || $2 != "ssh-ed25519" {invalid=1} END {exit (!NR || invalid)}' "$scan_file"
          mapfile -t fingerprints < <(
            ssh-keygen -lf "$scan_file" -E sha256 |
              awk '{print $2}' |
              sort -u
          )
          if (( ${#fingerprints[@]} != 1 )); then
            echo "Expected exactly one unique ED25519 host-key fingerprint; observed ${#fingerprints[@]}." >&2
            exit 1
          fi
          actual_fingerprint=${fingerprints[0]}
          if [[ "$actual_fingerprint" != "$PROD_SSH_HOST_KEY" ]]; then
            echo "Pinned ED25519 SSH host-key fingerprint mismatch." >&2
            exit 1
          fi
          install -m 600 "$scan_file" "$known_hosts_file"

      - name: Verify remote production contract
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_USER: ${{ vars.PROD_USER }}
        run: |
          set -euo pipefail
          declare -A expected=(
            [deploy-production.sh]="$(sha256sum scripts/deploy/deploy-production.sh | awk '{print $1}')"
            [rollback-production.sh]="$(sha256sum scripts/deploy/rollback-production.sh | awk '{print $1}')"
            [install-production-env.sh]="$(sha256sum scripts/deploy/install-production-env.sh | awk '{print $1}')"
            [docker-compose.production.yaml]="$(sha256sum infra/compose/docker-compose.production.yaml | awk '{print $1}')"
            [ssh-gateway.sh]="$(sha256sum scripts/deploy/ssh-gateway.sh | awk '{print $1}')"
          )
          remote_contract=$(ssh -i "$RUNNER_TEMP/prod-key" -p "$PROD_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/prod-known-hosts" \
            "$PROD_USER@$PROD_HOST" verify-contract)
          declare -A seen=()
          mismatch=0
          count=0
          while IFS=' ' read -r name hash extra; do
            [[ -z "${name:-}" ]] && continue
            expected_hash=''
            case "$name" in
              deploy-production.sh|rollback-production.sh|install-production-env.sh|docker-compose.production.yaml|ssh-gateway.sh)
                expected_hash=${expected[$name]}
                ;;
              *)
                mismatch=1
                break
                ;;
            esac
            if [[ -n "${extra:-}" || ! "$hash" =~ ^[0-9a-f]{64}$ || "$hash" != "$expected_hash" || -n "${seen[$name]:-}" ]]; then
              mismatch=1
              break
            fi
            seen[$name]=1
            ((count += 1))
          done <<< "$remote_contract"
          for name in "${!expected[@]}"; do
            if [[ -z "${seen[$name]:-}" ]]; then
              mismatch=1
              break
            fi
          done
          if (( mismatch != 0 || count != ${#expected[@]} )); then
            echo 'Production contract mismatch: remote root-owned files do not match the current main revision.' >&2
            exit 1
          fi

      - name: Preflight rollback image and public ingress
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          PROD_EXPECTED_IP: ${{ vars.PROD_EXPECTED_IP }}
          ICP_PANEL_DOMAIN: ${{ vars.ICP_PANEL_DOMAIN }}
        run: |
          set -euo pipefail

          validate_ipv4() {
            local ip=$1
            local IFS=.
            local -a octets
            local octet

            read -r -a octets <<< "$ip"
            if (( ${#octets[@]} != 4 )); then
              return 1
            fi
            for octet in "${octets[@]}"; do
              [[ "$octet" =~ ^[0-9]{1,3}$ ]] || return 1
              if [[ ${#octet} -gt 1 && "$octet" == 0* ]]; then
                return 1
              fi
              (( 10#$octet <= 255 )) || return 1
            done
          }

          check_https() {
            local label=$1
            local domain=$2
            local http_status

            if ! http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "https://${domain}/"); then
              echo "${label} TLS validation failed for https://${domain}/" >&2
              return 1
            fi
            if [[ "$http_status" == 000 || ! "$http_status" =~ ^[0-9]{3}$ || "$http_status" -lt 200 || "$http_status" -gt 599 ]]; then
              echo "${label} returned an invalid or unreachable HTTP status: ${http_status}" >&2
              return 1
            fi
            echo "${label} status observed: ${http_status}"
          }

          case "$IMAGE_REPOSITORY" in
            ghcr.io/tadashiyukoyama/centraldeatendimentochat|ghcr.io/cesaryukoyama28-eng/centraldeatendimentochat) ;;
            *) exit 64 ;;
          esac
          test -n "$IMAGE_TAG"
          test -n "$PROD_DOMAIN"
          test -n "$PROD_EXPECTED_IP"
          test -n "$ICP_PANEL_DOMAIN"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          validate_ipv4 "$PROD_EXPECTED_IP"

          anonymous_config=$(mktemp -d "$RUNNER_TEMP/ghcr-anonymous.XXXXXX")
          trap 'rm -rf -- "$anonymous_config"' EXIT
          chmod 700 "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${IMAGE_TAG}" >/dev/null

          mapfile -t resolved_ips < <(getent ahostsv4 "$PROD_DOMAIN" | awk '{print $1}' | sort -u)
          if (( ${#resolved_ips[@]} != 1 )) || [[ "${resolved_ips[0]:-}" != "$PROD_EXPECTED_IP" ]]; then
            echo "PROD_DOMAIN does not resolve exclusively to PROD_EXPECTED_IP: ${PROD_DOMAIN}" >&2
            exit 1
          fi
          check_https 'Chatwoot domain' "$PROD_DOMAIN"
          check_https 'ICP panel domain' "$ICP_PANEL_DOMAIN"

      - name: Roll back exact image and verify ICP
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          ICP_PANEL_DOMAIN: ${{ vars.ICP_PANEL_DOMAIN }}
          PROD_EXPECTED_IP: ${{ vars.PROD_EXPECTED_IP }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_USER: ${{ vars.PROD_USER }}
        run: |
          set -euo pipefail
          case "$IMAGE_REPOSITORY" in
            ghcr.io/tadashiyukoyama/centraldeatendimentochat|ghcr.io/cesaryukoyama28-eng/centraldeatendimentochat) ;;
            *) exit 64 ;;
          esac
          ssh -i "$RUNNER_TEMP/prod-key" -p "$PROD_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/prod-known-hosts" \
            "$PROD_USER@$PROD_HOST" \
            "rollback-production $IMAGE_REPOSITORY $IMAGE_TAG $PROD_DOMAIN $ICP_PANEL_DOMAIN $PROD_EXPECTED_IP" </dev/null

      - name: Record rollback target
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: echo "Production rollback completed to ${IMAGE_REPOSITORY}:${IMAGE_TAG}." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/prod-key" "$RUNNER_TEMP/prod-host-key.ed25519.scan" "$RUNNER_TEMP/prod-known-hosts"
