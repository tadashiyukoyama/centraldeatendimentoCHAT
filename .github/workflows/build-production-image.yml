name: Build production image

on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'docker/**'
      - 'enterprise/**'
      - 'Gemfile*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-production-image.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/tadashiyukoyama/centraldeatendimentochat:${{ github.sha }}
          cache-from: type=gha,scope=centraldeatendimentochat-production
          cache-to: type=gha,mode=max,scope=centraldeatendimentochat-production

      - name: Record image digest
        if: github.event_name != 'pull_request'
        run: |
          test -n "${{ steps.image.outputs.digest }}"
          echo "GHCR image: ghcr.io/tadashiyukoyama/centraldeatendimentochat:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
