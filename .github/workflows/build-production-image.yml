name: Build production image

on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'docker/**'
      - 'enterprise/**'
      - 'Gemfile*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-production-image.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  captain-agent-quality:
    # Ruby and service-container dependencies remain on the ephemeral hosted
    # image. The persistent runner is reserved for the expensive Docker build.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      - name: Run targeted Agent SDK lint
        run: >-
          bundle exec rubocop
          enterprise/app/jobs/captain/conversation/message_builder.rb
          enterprise/app/jobs/captain/conversation/response_builder_job.rb
          enterprise/app/models/captain/assistant.rb
          enterprise/app/models/captain/scenario.rb
          enterprise/app/models/concerns/agentable.rb
          enterprise/app/services/captain/assistant/agent_runner_service.rb
          enterprise/app/services/captain/assistant/runner_state_helper.rb
          enterprise/app/services/captain/assistant/turn_contract_validator.rb
          enterprise/app/services/captain/assistant/turn_contract_runner_service.rb
          enterprise/app/services/captain/assistant/turn_response_quality_validator.rb
          enterprise/app/services/captain/conversation/commercial_turn_policy.rb
          enterprise/app/services/captain/conversation/contact_profile_status.rb
          enterprise/app/services/captain/conversation/demo_consent.rb
          enterprise/app/services/captain/conversation/lead_classification_service.rb
          enterprise/app/services/captain/llm/assistant_chat_service.rb
          enterprise/lib/captain/response_schema.rb
          enterprise/lib/captain/commercial_response_schema.rb
          enterprise/lib/captain/tools/classify_lead_tool.rb
          enterprise/lib/captain/tools/capture_contact_profile_tool.rb
          enterprise/lib/captain/tools/handoff_tool.rb
          enterprise/lib/captain/tools/schedule_demo_tool.rb
          spec/enterprise/jobs/captain/conversation/response_builder_job_spec.rb
          spec/enterprise/lib/captain/tools/classify_lead_tool_spec.rb
          spec/enterprise/lib/captain/commercial_response_schema_spec.rb
          spec/enterprise/lib/captain/tools/capture_contact_profile_tool_spec.rb
          spec/enterprise/lib/captain/tools/handoff_tool_spec.rb
          spec/enterprise/lib/captain/tools/schedule_demo_tool_spec.rb
          spec/enterprise/models/captain/assistant_commercial_contract_spec.rb
          spec/enterprise/models/captain/assistant_spec.rb
          spec/enterprise/models/concerns/agentable_spec.rb
          spec/enterprise/services/captain/assistant/agent_runner_service_spec.rb
          spec/enterprise/services/captain/assistant/turn_contract_validator_spec.rb
          spec/enterprise/services/captain/conversation/commercial_turn_policy_spec.rb
          spec/enterprise/services/captain/conversation/contact_profile_status_spec.rb
          spec/enterprise/services/captain/conversation/lead_classification_service_spec.rb

      - name: Run targeted Agent SDK specs
        run: >-
          bundle exec rspec
          spec/enterprise/jobs/captain/conversation/response_builder_job_spec.rb
          spec/enterprise/lib/captain/tools/classify_lead_tool_spec.rb
          spec/enterprise/lib/captain/commercial_response_schema_spec.rb
          spec/enterprise/lib/captain/tools/capture_contact_profile_tool_spec.rb
          spec/enterprise/lib/captain/tools/handoff_tool_spec.rb
          spec/enterprise/lib/captain/tools/schedule_demo_tool_spec.rb
          spec/enterprise/models/captain/assistant_commercial_contract_spec.rb
          spec/enterprise/models/captain/assistant_spec.rb
          spec/enterprise/models/concerns/agentable_spec.rb
          spec/enterprise/services/captain/assistant/agent_runner_service_spec.rb
          spec/enterprise/services/captain/assistant/turn_contract_validator_spec.rb
          spec/enterprise/services/captain/conversation/commercial_turn_policy_spec.rb
          spec/enterprise/services/captain/conversation/contact_profile_status_spec.rb
          spec/enterprise/services/captain/conversation/lead_classification_service_spec.rb
          spec/enterprise/services/captain/llm/assistant_chat_service_spec.rb
          --format progress

  build:
    needs: captain-agent-quality
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'acelerachat-ci' }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Validate dedicated runner boundary
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_RUNNER_NAME: vps10056-acelerachat
          MIN_FREE_GIB: '18'
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          security_options=$(docker info --format '{{json .SecurityOptions}}')
          [[ "$security_options" == *rootless* ]]
          free_gib=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          (( free_gib >= MIN_FREE_GIB ))
          echo "Dedicated runner verified with ${free_gib} GiB free." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/tadashiyukoyama/centraldeatendimentochat:${{ github.sha }}
          cache-from: type=gha,scope=centraldeatendimentochat-production
          cache-to: type=gha,mode=max,scope=centraldeatendimentochat-production

      - name: Record image digest
        if: github.event_name != 'pull_request'
        run: |
          test -n "${{ steps.image.outputs.digest }}"
          echo "GHCR image: ghcr.io/tadashiyukoyama/centraldeatendimentochat:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
