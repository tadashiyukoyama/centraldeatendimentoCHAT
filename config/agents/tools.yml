######  Captain Agent Tools Configuration #######
# id: Tool identifier used to resolve the class (Captain::Tools::{PascalCase(id)}Tool)
# title: Human-readable tool name for frontend display
# description: Brief description of what the tool does
# icon: Icon name for frontend display (frontend icon system)
#######################################################

- id: add_contact_note
  title: 'Add Contact Note'
  description: 'Add a note to a contact profile'
  icon: 'note-add'

- id: add_private_note
  title: 'Add Private Note'
  description: 'Add a private note to a conversation (internal only)'
  icon: 'eye-off'

- id: update_priority
  title: 'Update Priority'
  description: 'Update conversation priority level'
  icon: 'exclamation-triangle'

- id: add_label_to_conversation
  title: 'Add Label to Conversation'
  description: 'Add a label to a conversation'
  icon: 'tag'

- id: classify_lead
  title: 'Classify Lead'
  description: 'Apply the canonical lead classification to a conversation'
  icon: 'tag'

- id: capture_contact_profile
  title: 'Capture Contact Profile'
  description: 'Save name, phone, email, and company explicitly provided by the contact'
  icon: 'contact'

- id: schedule_demo
  title: 'Schedule Demonstration'
  description: 'Create a real demonstration appointment and transfer it to the responsible specialist'
  icon: 'calendar'

- id: record_payment_notice
  title: 'Record Payment Notice'
  description: 'Record a payment notice as pending verification and route it to finance'
  icon: 'receipt'

- id: lookup_payment_status
  title: 'Lookup Payment Status'
  description: 'Read the verification status of payment notices for the current contact'
  icon: 'search'

- id: faq_lookup
  title: 'FAQ Lookup'
  description: 'Search FAQ responses using semantic similarity'
  icon: 'search'

- id: resolve_conversation
  title: 'Resolve Conversation'
  description: 'Resolve a conversation when the issue has been addressed'
  icon: 'checkmark'

- id: handoff
  title: 'Handoff to Human'
  description: 'Hand off the conversation to the owner or a department'
  icon: 'user-switch'
